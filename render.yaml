services:
  - type: web
    name: frauddetect
    runtime: docker
    plan: free
    repo: https://github.com/gabmali/frauddetect
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_DEMO
        value: "1"
      - key: STATIC_DIR
        value: frontend/dist
      - key: REQUIRE_DEMO_AUTH
        value: "1"
      - key: DEMO_ACCESS_USER
        value: recrutador
      - key: DEMO_ACCESS_PASSWORD
        sync: false
