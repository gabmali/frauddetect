services:
  - type: web
    name: frauddetect
    runtime: docker
    plan: free
    repo: https://github.com/gabmali/frauddetect
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEMO
        value: "1"
      - key: STATIC_DIR
        value: frontend/dist
